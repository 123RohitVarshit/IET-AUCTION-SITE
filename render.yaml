services:
  - type: web
    name: iet-auction-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_PIN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

name: Keep Render Server Alive

on:
  schedule:
    # Every 5 minutes, starting at minute 2
    - cron: "2/5 * * * *"

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render
        run: |
          URL="https://iet-auction-site.onrender.com/api/stage/state"

          echo "======================================"
          echo "Render Keep Alive"
          echo "URL: $URL"
          echo "UTC: $(date -u)"
          echo "======================================"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output /tmp/response.txt \
            --write-out "%{http_code}" \
            --connect-timeout 15 \
            --max-time 60 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            "$URL" || true)

          echo "HTTP: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Render is alive."
            head -c 500 /tmp/response.txt
            echo
          else
            echo "⚠️ State endpoint returned $HTTP_CODE"
            echo "Trying root endpoint..."

            ROOT_CODE=$(curl \
              --silent \
              --show-error \
              --output /tmp/response.txt \
              --write-out "%{http_code}" \
              --connect-timeout 15 \
              --max-time 60 \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              "https://iet-auction-site.onrender.com/" || true)

            echo "Root HTTP: $ROOT_CODE"
            head -c 500 /tmp/response.txt
            echo

            if [ "$ROOT_CODE" = "200" ]; then
              echo "✅ Render is reachable."
            else
              echo "❌ Render is not responding."
              exit 1
            fi
          fi
